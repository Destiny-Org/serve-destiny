# Installs the Destiny compiler (the destiny64 package from
# Destiny-Org/host-compilers) and DES (built from Destiny-Org/des), and
# puts both on PATH. Linux x86_64 only: that is the only destiny64 package.
name: Set up Destiny
description: Install destiny64 and Destiny's dub
inputs:
  version:
    description: destiny version (e.g. 2.115.0-master), or "latest"
    default: 2.115.0-master
  build-dub:
    description: build DES and put it on PATH
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install destiny64
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }} # for "latest" (GitHub API rate limit)
      run: |
        set -euo pipefail
        # released Destiny compilers live in Destiny-Org/host-compilers
        curl -fsSL --retry 5 https://raw.githubusercontent.com/Destiny-Org/host-compilers/main/host_compiler.sh -o "$RUNNER_TEMP/host_compiler.sh"
        spec="${{ inputs.version }}"
        [ "$spec" = latest ] && spec=destiny-latest
        case "$spec" in destiny*) ;; *) spec="destiny-$spec" ;; esac
        activate=$(bash "$RUNNER_TEMP/host_compiler.sh" "$spec" "$RUNNER_TOOL_CACHE/destiny-host")
        source "$activate"
        destiny --version | head -1

    - name: Build DES (Destiny's dub)
      if: inputs.build-dub == 'true'
      shell: bash
      run: |
        set -euo pipefail
        src="$RUNNER_TEMP/des"
        git clone --depth 1 https://github.com/Destiny-Org/des.git "$src"
        cd "$src"
        GITVER=v1.40.0-destiny destiny -revert=safedefault -run build.d -revert=safedefault -O
        echo "$src/bin" >> "$GITHUB_PATH"
