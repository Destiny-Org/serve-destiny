name: Upload prebuild binaries
on:
  release:
    types: [published]

# Linux x86_64 only, built with Destiny (the only platform destiny64 ships for).
jobs:
  release:
    name: Deploy release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: serve-destiny
      - uses: actions/checkout@v7
        with:
          repository: Destiny-Org/d-scanner
          path: d-scanner
      - uses: actions/checkout@v7
        with:
          repository: Destiny-Org/des
          path: des

      - name: Install Destiny
        uses: ./serve-destiny/.github/actions/setup-destiny

      - name: Build
        working-directory: serve-destiny
        run: ./ci/build.sh && destiny -revert=safedefault -run ci/validate_version.d
        env:
          ARCH: x86_64

      - name: Upload
        working-directory: serve-destiny
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mv serve-destiny.tar.xz "serve-destiny_${TAG}-linux-x86_64.tar.xz"
          mv serve-destiny.tar.gz "serve-destiny_${TAG}-linux-x86_64.tar.gz"
          gh release upload "$TAG" serve-destiny_*-linux-x86_64.tar.*
