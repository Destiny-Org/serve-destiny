name: Run Unittests
on:
  push:
    branches:
    - master
  pull_request:

# Built and tested with Destiny only (destiny64 is packaged for Linux x86_64).
# d-scanner and dub are path dependencies (see dub.selections.json), so they
# are checked out next to this repository.
env:
  DFLAGS: -revert=safedefault -lowmem

jobs:
  dubtest:
    name: Dub Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: serve-destiny
      - uses: actions/checkout@v7
        with:
          repository: Destiny-Org/d-scanner
          path: d-scanner
      - uses: actions/checkout@v7
        with:
          repository: Destiny-Org/des
          path: des

      - name: Install Destiny
        uses: ./serve-destiny/.github/actions/setup-destiny

      - name: Run tests
        working-directory: serve-destiny
        timeout-minutes: 60
        run: |
          set -e
          for p in :workspace-destiny :protocol :dcd :lsp :serverbase; do
            des test --compiler=destiny --build-mode=singleFile $p
          done
          des build --compiler=destiny --root=null_server
          des run --compiler=destiny --root=null_server_test
          des test --compiler=destiny --build-mode=singleFile

      - name: Run standalone tests
        working-directory: serve-destiny/test
        timeout-minutes: 30
        run: ./runtests.sh

      - name: Editor smoke test
        working-directory: serve-destiny
        timeout-minutes: 15
        run: |
          ./ci/build.sh
          python3 test/destiny_smoke.py ./serve-destiny test/data/destiny_smoke.d
        env:
          ARCH: x86_64
